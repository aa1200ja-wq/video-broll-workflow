<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B-roll Workflow</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <strong>B-roll Workflow</strong>
        <small>旁白 → 素材 → 剪映草稿</small>
      </div>
      <div class="create-project">
        <input id="new-project-name" placeholder="新專案名稱" />
        <button id="create-project">新增</button>
      </div>
      <div id="project-list" class="project-list"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="project-title">請建立專案</h1>
          <small id="project-meta"></small>
        </div>
        <nav class="tabs">
          <button class="tab active" data-tab="work">製作</button>
          <button class="tab" data-tab="library">素材庫</button>
          <button class="tab" data-tab="settings">設定</button>
        </nav>
      </header>

      <section id="work-panel" class="tab-panel">
        <div class="panel">
          <div class="panel-head"><h2>1. 旁白腳本</h2><span id="scene-count"></span></div>
          <textarea id="script" class="large" placeholder="一次貼上完整旁白稿"></textarea>
          <button id="split-script">依標點切成 Scene</button>
        </div>

        <div class="panel">
          <h2>2. 產生旁白＋時間碼</h2>
          <div class="grid-4">
            <label>聲音<input id="voice" value="zh-TW-YunJheNeural" /></label>
            <label>語速<input id="rate" value="+0%" /></label>
            <label>音調<input id="pitch" value="+0Hz" /></label>
            <button id="make-tts" class="primary">產生旁白＋時間碼</button>
          </div>
        </div>

        <div class="panel">
          <h2>3. 批次搜尋素材</h2>
          <textarea id="bulk-queries" class="medium"
            placeholder="每行一組搜尋詞，依序對應 Scene 1、2、3……"></textarea>
          <div class="toolbar wrap">
            <label class="check"><input type="checkbox" value="pexels" class="source" checked /> Pexels</label>
            <label class="check"><input type="checkbox" value="pixabay" class="source" checked /> Pixabay</label>
            <label class="check"><input type="checkbox" value="wikimedia" class="source" checked /> Wikimedia</label>
            <button id="search-all" class="primary">套用並搜尋全部素材</button>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>4. Scene 與候選素材</h2>
            <span>每幕可重搜、上傳或改用素材庫</span>
          </div>
          <div id="scene-list"></div>
        </div>

        <div class="panel">
          <h2>5. 輸出</h2>
          <div class="toolbar wrap">
            <button id="make-preview">產生粗剪預覽</button>
            <a id="open-preview" class="button-link disabled" target="_blank">開啟粗剪</a>
            <button id="export-jianying" class="primary">建立剪映草稿</button>
          </div>
          <p class="hint">最終主要輸出是可繼續編輯的剪映草稿；粗剪 MP4 只用來快速檢查。</p>
        </div>
      </section>

      <section id="library-panel" class="tab-panel hidden">
        <div class="panel">
          <div class="panel-head"><h2>全域素材庫</h2><span>所有專案共用；搜尋 Scene 時會優先顯示本機素材</span></div>
          <div class="toolbar">
            <input id="library-query" placeholder="搜尋：海浪、ocean、coast…" />
            <button id="library-search">搜尋</button>
            <select id="library-scene"></select>
          </div>
          <div id="library-grid" class="card-grid"></div>
        </div>
      </section>

      <section id="settings-panel" class="tab-panel hidden">
        <div class="panel settings-grid">
          <div>
            <h2>素材 API</h2>
            <label>Pexels API Key<input id="pexels-key" type="password" placeholder="未修改" /></label>
            <label>Pixabay API Key<input id="pixabay-key" type="password" placeholder="未修改" /></label>
            <button id="save-api-keys">儲存 API Key</button>
            <p id="api-status" class="hint"></p>
          </div>
          <div>
            <h2>剪映草稿位置</h2>
            <label>草稿資料夾<input id="jianying-dir" placeholder="例如 D:\JianyingPro Drafts" /></label>
            <div class="toolbar wrap">
              <button id="detect-jianying">自動偵測</button>
              <button id="save-jianying" class="primary">儲存位置</button>
            </div>
            <p class="hint">也可從剪映「全域設定 → 草稿位置」複製路徑。</p>
          </div>
        </div>
      </section>

      <div id="toast" class="toast hidden"></div>
    </main>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
