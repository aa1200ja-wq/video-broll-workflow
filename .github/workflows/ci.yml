name: CI and Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/server/requirements.txt pytest
      - name: Run tests
        env:
          PYTHONPATH: apps/server
        run: |
          python -m compileall -q apps/server
          pytest -q apps/server/tests

  windows-package:
    needs: test
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/server/requirements.txt pyinstaller
      - name: Build portable Windows app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name BrollWorkflow `
            --paths apps/server `
            --add-data "apps/server/app/web;app/web" `
            --collect-all imageio_ffmpeg `
            --collect-all pyJianYingDraft `
            run_local.py
          Copy-Item README.md dist\BrollWorkflow\README.md
          Compress-Archive -Path dist\BrollWorkflow\* -DestinationPath BrollWorkflow-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BrollWorkflow-Windows
          path: BrollWorkflow-Windows.zip
          retention-days: 30
