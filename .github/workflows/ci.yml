name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/server/requirements.txt pytest

      - name: Test backend
        env:
          PYTHONPATH: apps/server
        run: pytest -q apps/server/tests

      - name: Build frontend
        working-directory: apps/web
        run: |
          npm install
          npm run build
